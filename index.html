<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker Dashboard</title>
  <link rel="stylesheet" href="expensetrackers.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <h2>Expense Tracker</h2>
    <button id="theme-toggle">🌙</button>
  </header>

  <main class="main-content">
    <!-- Left side -->
    <section class="left-panel">
      <div class="form-section">
        <h3>Add New Transaction</h3>
        <form id="form">
          <div class="form-control">
            <label for="text">Text</label>
            <input type="text" id="text" placeholder="Enter name" />
          </div>
          
          <div class="form-control toggle-control">
            <label for="transaction-type">Type</label>
            <button type="button" id="transaction-type" class="toggle-btn">Expense</button>
          </div>
          
          <div class="form-control">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" />
          </div>
          
          
          <button class="btn">Submit</button>
        </form>
      </div>

      <div class="history-section">
        <div class="history-header">
          <h3>History</h3>
          <div class="filter-buttons">
            <button id="daily-btn" class="filter-btn active">Daily</button>
            <button id="weekly-btn" class="filter-btn">Weekly</button>
            <button id="monthly-btn" class="filter-btn">Monthly</button>
          </div>
        </div>
        <ul id="list" class="list"></ul>
      </div>
    </section>

    <!-- Right side -->
    <section class="right-panel">
      <div class="balance-section">
        <h4>Your Balance</h4>
        <h1 id="balance">&#8377;0.00</h1>
        <div class="inc-exp-container">
          <div>
            <h4>Income</h4>
            <p id="money-plus" class="money-plus">+&#8377;0.00</p>
          </div>
          <div>
            <h4>Expense</h4>
            <p id="money-minus" class="money-minus">-&#8377;0.00</p>
          </div>
        </div>
      </div>

      <div class="chart-section">
        <canvas id="expense-chart" width="400" height="400"></canvas>
      </div>
    </section>
  </main>

  <script src="trackerscript.js"></script>
</body>
</html>
